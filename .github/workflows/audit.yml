name: Security audit

# Checks the app's dependencies against the public advisory databases once
# a week (and on demand). Dependencies change under us even when our code
# doesn't, so this runs on a schedule rather than on pull requests. A high
# or critical advisory opens an issue - or comments on the open one - so it
# can't go unnoticed. Go advisories count only where Textus calls the
# vulnerable code: govulncheck follows the calls.

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC, after the model sync
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm advisories (what ships in the app)
        id: npm
        continue-on-error: true
        run: |
          set -o pipefail
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high | tee npm-audit.txt

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Pinned, like every tool here: a new release changes nothing by itself.
      - name: Go advisories
        id: go
        continue-on-error: true
        run: |
          set -o pipefail
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... | tee go-vulncheck.txt

      - name: Report
        if: steps.npm.outcome == 'failure' || steps.go.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Security advisories in dependencies (main)"
          {
            echo "The weekly audit found advisories ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))."
            echo
            [ -s npm-audit.txt ] && { echo '<details><summary>npm audit</summary>'; echo; echo '```'; tail -n 60 npm-audit.txt; echo '```'; echo '</details>'; }
            [ -s go-vulncheck.txt ] && { echo '<details><summary>govulncheck</summary>'; echo; echo '```'; tail -n 60 go-vulncheck.txt; echo '```'; echo '</details>'; }
          } > body.md
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
          exit 1
