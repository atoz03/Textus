name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild (for example v0.8.11)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # The one place the product's name is spelled for this workflow: the
  # release title.
  PRODUCT_NAME: Textus

permissions:
  contents: write

# One run per tag at a time: a rebuild started while the tag's first run is
# still uploading would race it for the same draft's assets.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Cheap checks on a Linux runner before any macOS/Windows minutes are
  # spent: the tag must name the version the app's files carry, and a
  # stable tag needs its release notes.
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Validate version tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]'

      # The checks come from the commit this workflow runs at (so a rebuild
      # of a tag older than scripts/check-versions.mjs still gets them);
      # what they check is the tag.
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: tagged

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Tag matches the app version
        run: node scripts/check-versions.mjs --root tagged --tag "$RELEASE_TAG"

      # The tagged app reads textus-latest.json, its workflow refuses a
      # release that carries latest.json - the manifest every Levis install
      # reads - and mygo.json has the key its updates are signed for
      # (scripts/updater-manifest.mjs). This also refuses a rebuild of an
      # old Levis tag from this workflow.
      - name: Updater never serves Levis's manifest
        run: node scripts/updater-manifest.mjs check --root tagged

      # Required for a newly pushed stable tag. A rebuild of a tag from
      # before release notes were kept (0.8.10 and older) only warns.
      - name: Release notes exist for a stable tag
        if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
        run: |
          notes="docs/releases/${RELEASE_TAG#v}.md"
          if [ -s "tagged/$notes" ]; then exit 0; fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::error::$notes is missing at $RELEASE_TAG - write the release notes before tagging."
            exit 1
          fi
          echo "::warning::$notes is missing at $RELEASE_TAG; the release keeps its current notes."

      # The builds each upload to the tag's draft, made by whichever found
      # none; two starting together made two and split the files between
      # them (v1.2.5). Made here once, before any build, they share it.
      - name: One draft for the builds to share
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then exit 0; fi
          gh release create "$RELEASE_TAG" --draft --verify-tag \
            --title "$PRODUCT_NAME $RELEASE_TAG" --notes "" \
            $([[ "$RELEASE_TAG" == *-* ]] && echo --prerelease)

  # The full suite, once, on the tagged commit: pull requests into main run
  # only the quick checks (ci.yml). A rebuild of an older tag by hand skips
  # it, as its commit's suite ran when it was tagged.
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  # `mygo build` on two runners: MyGo needs no cgo, so Ubuntu makes the
  # Linux apps and packages of both architectures and the Windows apps with
  # their NSIS installers; macOS needs a Mac for signing, notarization and
  # the disk images. Each uploads its installers and its signed updates
  # (update-<target>.json and the archives and deltas it names) to the
  # tag's draft.
  build:
    needs: [preflight, ci]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    name: build (${{ matrix.name }})
    timeout-minutes: 90
    # The signing keys live in the release environment, which only
    # runs from a release tag (v*); only admins can push those.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26 is what macos-latest points at today (same arm64
          # pool); pinned so the next image switch is a deliberate change.
          # Intel Macs' app is cross-compiled on it.
          - name: macOS
            os: macos-26
            platform: darwin/arm64,darwin/amd64
          - name: Linux
            os: ubuntu-24.04
            platform: linux/amd64,linux/arm64
          # Windows ships the NSIS installer (docs/dev/windows-installer.md).
          - name: Windows
            os: ubuntu-24.04
            platform: windows/amd64,windows/arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install frontend dependencies
        run: npm ci

      # MyGo makes the Windows installer with NSIS, which Ubuntu packages.
      - name: Install NSIS
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis

      # Without it the apps can't update themselves: each update archive is
      # signed with it, and the apps check that signature against
      # updates.publicKey in mygo.json (preflight checked that one).
      - name: Require the update signing key
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::error::MYGO_UPDATER_PRIVATE_KEY is not set: the release would ship no signed updates."
            exit 1
          fi

      # With the signing secrets missing, the app would be signed ad hoc,
      # which Gatekeeper blocks on every other Mac.
      - name: Require the macOS signing secrets
        if: matrix.name == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set: the app would ship unsigned."
              exit 1
            fi
          done

      # The Developer ID certificate and the notary service's credentials,
      # in a keychain of their own that lives as long as the job. `mygo
      # build` signs the app with the identity (-sign) and, with
      # macos.notarize, notarizes the app and the disk image and staples
      # them; that setting is added here only, so builds on a developer's
      # Mac stay ad hoc and skip the notary service.
      - name: Import the certificate and the notary credentials
        if: matrix.name == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD"
          jq --arg keychain "$keychain" \
            '.macos.notarize = {keychainProfile: "notary", keychain: $keychain}' \
            mygo.json > "$RUNNER_TEMP/mygo.json"
          mv "$RUNNER_TEMP/mygo.json" mygo.json

      # Each target's app and installers in dist-app/<os>-<arch>/, with its
      # signed update: textus-<version>-<os>-<arch>.tar.gz, the deltas from
      # the last versions published (updates.deltas) and update-<target>.json.
      # A pre-release builds an .rpm too: MyGo writes its version as
      # 1.0.4~rc.1, which RPM sorts before 1.0.4.
      - name: Build
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          sign=()
          if [ "$RUNNER_OS" = macOS ]; then sign=(-sign "$APPLE_SIGNING_IDENTITY"); fi
          npx mygo build -platform "$PLATFORM" "${sign[@]}"

      # Only what users install and what updates read: not the bare
      # executables, icons and desktop entry beside them. install.sh, which
      # installs the Linux archive for the user, is the same for both
      # architectures.
      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(
            dist-app/*/*.dmg
            dist-app/*/textus-setup-*.exe
            dist-app/*/*.deb
            dist-app/*/*.rpm
            dist-app/*/textus-*.tar.gz
            dist-app/*/*.delta
            dist-app/*/update-*.json
          )
          if [ "$RUNNER_OS" = Linux ] && [ -f dist-app/linux-amd64/install.sh ]; then
            files+=(dist-app/linux-amd64/install.sh)
          fi
          printf '%s\n' "${files[@]}"
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

      # textus-bin (packaging/arch/PKGBUILD) installs this tarball. Its
      # binary is a second build, linked as the AUR's
      # (backend/distribution.go): it reports new versions but does not
      # install them, because pacman owns /usr/bin. It reuses the frontend
      # the first build made. x86_64 only: the package is built and tested
      # in the x86_64-only archlinux container, and [catvinci] serves no
      # aarch64 repository.
      - name: Build and upload AUR tarball
        if: matrix.name == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYGO_LDFLAGS: -X textus/backend.distribution=aur
        run: |
          npx mygo build -platform linux/amd64 -skip-build-command -o "$RUNNER_TEMP/aur"
          scripts/package-linux-tarball.sh "${RELEASE_TAG#v}" \
            "$RUNNER_TEMP/aur/linux-amd64/textus" dist-aur
          gh release upload "$RELEASE_TAG" dist-aur/* --clobber

  # Builds and tests textus-bin and attaches it to the draft (see
  # arch-package.yml). Before publish, so a broken package keeps the whole
  # release a draft.
  arch-package:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/arch-package.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

  # The jobs after the builds say when they run: without that, a rebuild
  # (workflow_dispatch, its CI skipped) skipped them all, as a skipped job
  # passes its skip on to every job that needs it.
  publish:
    needs: [build, arch-package]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.arch-package.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      newest-stable: ${{ steps.newest.outputs.newest-stable }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The updater reads textus-latest.json from the newest release the
      # moment it is published. It is written here, once every platform's
      # signed update is on the draft, from the update-<target>.json files
      # `mygo build` wrote: each target's archive, size, signature and
      # deltas, at the release's download URL. A platform whose build
      # silently failed to upload (a race, an upload error) has no manifest,
      # and the build step fails rather than leave every user of that
      # platform without the update.
      - name: Write the updater manifest (textus-latest.json)
        run: |
          updates="$RUNNER_TEMP/updates"
          mkdir -p "$updates"
          gh release download "$RELEASE_TAG" --pattern 'update-*.json' --dir "$updates" --clobber
          notes="docs/releases/${RELEASE_TAG#v}.md"
          node scripts/updater-manifest.mjs build \
            --version "${RELEASE_TAG#v}" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" \
            --update-dir "$updates" \
            $([ -f "$notes" ] && printf -- '--notes-file %s' "$notes") \
            --out "$RUNNER_TEMP/textus-latest.json"
          jq '{version, platforms: (.platforms | keys)}' "$RUNNER_TEMP/textus-latest.json"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/textus-latest.json" --clobber

      # The last gate before anything is public: no latest.json on the
      # release. Levis installs read that name from the newest release (the
      # old repository URL redirects here) and trust the same signing key,
      # so they would install whatever it names over Levis. Releases up to
      # 1.1.0 carried a copy of Levis 0.9.8's own; Levis support ended
      # there, so none is allowed now. A rebuild of one of those tags stops
      # here until that copy is deleted from the release.
      - name: No latest.json on the release
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            > "$RUNNER_TEMP/assets.txt"
          node scripts/updater-manifest.mjs guard --assets-file "$RUNNER_TEMP/assets.txt"

      # A workflow_dispatch rebuild of an old tag republishes that release,
      # but making it "Latest" or pointing the mirror or arch-repo at it
      # would downgrade everyone. Asked here, after the builds, not when
      # the run started: a hotfix tag pushed while this one was still
      # building is newer by the time this one is published.
      - name: Is this the newest stable tag?
        id: newest
        run: |
          newest=$(git ls-remote --tags --refs origin 'v*.*.*' \
            | sed 's|.*refs/tags/||' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n1)
          echo "Newest stable tag: ${newest:-none}"
          if [ "$newest" = "$RELEASE_TAG" ]; then
            echo "newest-stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "newest-stable=false" >> "$GITHUB_OUTPUT"
          fi

      # A rebuilt older tag must not become GitHub's "Latest" release: the
      # updater and the website's download links follow releases/latest.
      - name: Publish completed release
        env:
          NEWEST_STABLE: ${{ steps.newest.outputs.newest-stable }}
        run: |
          NOTES="docs/releases/${RELEASE_TAG#v}.md"
          if [ -f "$NOTES" ]; then
            gh release edit "$RELEASE_TAG" --notes-file "$NOTES"
          fi
          if [ "$NEWEST_STABLE" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest=false
          fi

  # After publishing every tag, release candidates included: the beta update
  # channel's manifest (textus-beta.json on the download bucket), which is
  # that channel's only way to see a pre-release. It moves only forward, so
  # rebuilding an older tag leaves it where it is.
  update-beta-manifest:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    uses: ./.github/workflows/update-beta-manifest.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

  # After publishing, only for the newest stable tag: the download mirror
  # and the [catvinci] pacman repository. Pre-releases have no channel of
  # their own in either, so pointing them at an rc would hand it to
  # everyone; an older tag would downgrade. Each is its own workflow and can
  # be re-run by hand for one tag. The Homebrew cask is Homebrew's own
  # (Casks/t/textus.rb in Homebrew/homebrew-cask); its bot bumps it.
  mirror-downloads:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.newest-stable == 'true' }}
    uses: ./.github/workflows/mirror-downloads.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

  # The browser playground follows the latest stable release.
  deploy-playground:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.newest-stable == 'true' }}
    uses: ./.github/workflows/deploy-playground.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

  # pacman also sorts 0.9.0_rc.1 above 0.9.0 (see update-arch-repo.yml).
  update-arch-repo:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.newest-stable == 'true' }}
    uses: ./.github/workflows/update-arch-repo.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
